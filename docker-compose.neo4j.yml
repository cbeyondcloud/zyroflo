services:
  neo4j:
    image: neo4j:5-community
    container_name: sdlc-harness-neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      # No fallback password on purpose. A default here disagreed with the one the Python
      # store defaults to, so `compose up` succeeded and every query then failed to
      # authenticate against a database that was demonstrably running. `.env` is the single
      # source: compose reads it from this directory, and so does the store.
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?copy .env.example to .env and set NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
      # Community edition: no APOC dependency by design (all traversal is per-hop Cypher).
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
