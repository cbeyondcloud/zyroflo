# The weekly graph snapshot (harness item 58).
#
# GENERATED by sdlc-init.py — re-run the installer to refresh it.
#
# WHAT THIS KEEPS TRUE. `.sdlc/graph/` is committed on purpose: it is how the next
# person to clone this repository inherits a baseline instead of rebuilding one and
# hoping it matches. A committed baseline nobody refreshes goes stale silently, and
# stale is indistinguishable from current until somebody acts on it — which is the
# whole reason a context pack carries a freshness stamp.
#
# FACTS ONLY. `--publish-snapshot` writes each component's extracted facts and
# nothing else; what the link passes derive is recomputed at load. That is what
# keeps the snapshot diffable in a pull request instead of churning on every build.
#
# IT REFUSES A RED BUILD. A build with failures or contract violations cannot
# become the new baseline — so a broken extractor cannot quietly overwrite the
# facts it broke.
#
# THIS JOB DOES NOT CHECK FOR DRIFT, AND THAT IS DELIBERATE. `--check-snapshot`
# answers a different question, and its answer has two opposite causes: the code
# moved (re-publish) or the same input now extracts to different bytes (an
# extractor regression). Only `manifest.stale_repos` separates them, and
# re-publishing a drift nobody diagnosed overwrites the evidence of the second case
# with the remedy for the first. That step stays a human's — see
# `docs/pilot-plan.md` in the harness.
#
# GITHUB DISABLES SCHEDULED WORKFLOWS after 60 days of repository inactivity, and
# does so quietly. If this job matters to you, `corpus_replay.py --check-fresh` is
# the pattern for noticing when a schedule has stopped; this one shows its last run
# in the Actions tab and nowhere else.
name: SDLC graph snapshot

on:
  schedule:
    # 04:23 UTC on Mondays. Not on the hour: GitHub's scheduler is best-effort and
    # the top of the hour is the most contended minute of the day.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two publishes racing produce a commit that holds half of each.
  group: sdlc-graph-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: publish the graph snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out the harness
        uses: actions/checkout@v4
        with:
          repository: '@@HARNESS_REPO@@'
          path: .sdlc-harness-ci
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5

      - name: Build and publish
        env:
          WORKSPACE: '@@WORKSPACE_REL@@'
        run: |
          uv run --project .sdlc-harness-ci \
            python tools/graph/build.py \
              --workspace "$WORKSPACE" \
              --out .sdlc/graph \
              --publish-snapshot

      # Only when something changed. A weekly commit that says nothing is how a
      # log stops being read, and `--publish-snapshot` is deterministic — identical
      # inputs produce identical shards, which is what item 13's rebuild-equals-
      # snapshot check rests on.
      - name: Commit the shards, if they moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sdlc/graph
          if git diff --cached --quiet; then
            echo "snapshot unchanged - nothing to commit"
          else
            git commit -m "chore(sdlc): weekly graph snapshot"
            git push
          fi
