# The repository's SDLC constitution (harness item 35).
#
# This file holds the NON-NEGOTIABLES: the loosest each dial is ever allowed to
# be. `.sdlc/profile.yml` holds the run configuration, and it may only make
# things TIGHTER. A profile that tries to loosen one of these is refused by
# name, so weakening a control costs a change to THIS file — which goes through
# the same gated run, and the same review, as any other change.
#
# That asymmetry is the whole design. Without it, `review.block_on: []` in a
# profile silently turns the review gate off and every run afterwards reports
# green.
#
# READ WITH THE STANDARD LIBRARY. The harness must enforce policy on a machine
# with no packages installed, so this file uses a deliberately small YAML
# subset: top-level scalars and lists, and one level of nesting. Anything
# outside it is REFUSED rather than guessed at - a policy file that is
# misread is worse than one that is missing, because it looks enforced.
schema_version: 1

# ── The gate regime floor ─────────────────────────────────────────────────────
# The loosest regime a run may select. Order: solo < team < regulated.
# `solo` is additionally unselectable once components > 1 (item 63) - that guard
# is structural and does not depend on this file being right.
gate_profile_floor: solo

# The severities that must ALWAYS block the review loop's exit. A profile may
# add to this list (regulated adds `medium`); it may never remove from it.
# Order, tightest last: info < low < medium < high < critical.
block_on_floor: [critical, high]

# Cross-person attribution. Order: none < dsse. Raising it to `dsse` makes an
# unsigned approval impossible - and, today, makes approval impossible at all
# until DSSE envelope writing lands, which approve.py says out loud rather than
# downgrading to unsigned.
signing_floor: none

# advisory | hard. Whether a changed-file coverage figure below the threshold is
# a finding a human weighs, or something P5 OWES and cannot leave the phase
# with. A profile may raise this to `hard`; it may never lower it. Unmeasurable
# coverage is a finding under both - a threshold silently reported as met
# because nothing measured it is worse than having no threshold.
coverage_enforcement_floor: advisory

# allow | forbid. `forbid` means the person who wrote the change may not be the
# person who approves it. With no author recorded to compare against, a run
# under `forbid` is REFUSED, never waved through: a control that cannot be
# evaluated has not been satisfied.
self_approval: allow

# ── What an agent may not do ──────────────────────────────────────────────────
# Every path an agent writes must be inside its own run's worktree, made under this
# directory with the run id appended. A directory of its own inside the repository,
# spelled with `/`: not blank or `.` (the repository itself), not absolute, no `..`,
# and no `./`, trailing `/`, backslash or padding - each is refused by name, with
# the one spelling to write instead.
worktrees_root: ".sdlc-worktrees"

# Files only the CLIs may write. Glob syntax is fnmatch against the
# repository-relative POSIX path; `**/x` matches x at any depth including none.
#
# `learning_log.jsonl` was listed here before item 50 exists to write it, and
# `feedback.jsonl` — the evidence that log is DISTILLED FROM — was not. The
# constitution protected the conclusion and left the input open, which is the
# wrong way round: an agent that can append to its own feedback record can
# manufacture the corrections the retro agent learns from, and every rule that
# follows is then something nobody decided.
protected_paths:
  - ".env"
  - "**/.env"
  - "**/policy.yml"
  - "**/approvals.jsonl"
  - "**/state.json"
  - "**/feedback.jsonl"
  - "**/learning_log.jsonl"
  # Every record under a metrics directory, as ONE rule rather than a
  # roster. `provider-smoke.jsonl` is a gate the CLI answers from
  # (`--status --milestone --require`), and while it was unlisted a
  # hand-written row claiming a green agent-tier run made that gate
  # report satisfied for a smoke nobody ran. `reviews.jsonl` (the M4
  # median) and `guardrail.jsonl` (refusals) were open for the same
  # reason: the list named files, so each new record had to be
  # remembered onto it, and the next one never was.
  - "**/metrics/*.jsonl"

# Agents publish to exactly one place: <push_branch_prefix><run-id> on this
# remote. Never a shared branch, never a tag, never anyone else's run.
# One remote, or a list of them for an estate whose components publish to
# different places - a fork here, an internal mirror there, because many
# upstreams will not take a direct push. A component may CHOOSE from this set in
# its own `vcs.push_remote` and may never name a remote that is not in it, so
# widening the set stays a change to the constitution.
#   push_remote: [origin, fork, internal-mirror]
push_remote: origin
# Every run branch starts with this. A component may set a longer
# `vcs.branch_pattern`, but it must still start here and must contain
# `<run-id>` - the CI ledger gate reads the same pattern to decide which pull
# request is about a run.
push_branch_prefix: "sdlc/"

# Git operations that destroy history or other people's work. Matched as
# substrings of the normalised command line, so `git push --force-with-lease`
# is caught by `--force` and `git  push   -f` by `-f` after whitespace collapse.
# Also matched by WORDS on every git command, in any order: a short flag by its
# letter inside a cluster, case kept, so `git clean -df` is `clean -f`,
# `git push origin -f` is `push -f`, and `git branch -d` is not `branch -D`.
# The word reading stops at a free-text option (`-m`, `-F`, `--grep`, ...), so
# a commit message that names an operation is not that operation.
deny_git:
  - "--force"
  - "-f origin"
  - "push -f"
  - "reset --hard"
  - "clean -f"
  - "filter-branch"
  - "filter-repo"
  - "branch -D"
  - "update-ref"
  - "reflog expire"
  - "gc --prune"

# Destruction git cannot undo, because it never reached git. `deny_git` above is
# git operations and says so in its name; before this list existed, the only
# wall against `rm -rf` was the permission file the installer writes for ONE
# runner, so every other runner had none.
#
# Matched by TOKENS, not substrings, and the difference is the point: a
# substring rule spelled "rm -rf" would miss `rm -fr`, `rm -Rf` and
# `rm -r -f`, and would refuse `confirm -rf plan.txt`, which contains it.
# Each rule is a program then requirements, ALL of which must be present;
# `|` separates spellings of one requirement. Short flags match by letter, so
# one rule covers every ordering of a cluster. The program is read without its
# directory, extension or case, a command is split on `&&`, `||`, `|` and `;`,
# and a command handed to an interpreter or to `find -exec` is judged too.
# What a shell removes before the program runs cannot hide it: a keyword
# (`if`, `then`, `do`, `!`), a leading redirect (`>log`, `2>&1`), quotes, a
# caret or a backslash inside its name, a quoted path. A rule naming a wrapper
# (`sudo`, `env`, `nice`) matches where that wrapper runs, never the bare word.
#
# Recursion alone is the trigger, not recursion plus force: `-f` only silences
# the prompts, so requiring it would be a silent miss on `rm -r tree`. This does
# mean `rm -rf node_modules` is refused - deliberately. A component's own
# declared build command runs from the profile, not through this wall.
#
# NOT covered, said out loud: permission changes (`chmod -R 777`), shell
# redirection (`> file` - a rule on it is a rule on every command that writes
# one), remote execution (`curl ... | sh` - real, and it needs its own wall
# rather than being smuggled into this one), and PowerShell `-EncodedCommand`.
deny_commands:
  - "rm -r|-R|--recursive|-recurse"
  - "rmdir /s|-recurse|-r"
  - "rd /s|-recurse|-r"
  - "del /s"
  - "erase /s"
  - "remove-item -recurse|-recu|-r"
  - "ri -recurse|-recu|-r"
  - "find -delete"
  - "dd of="
  - "mkfs"
  - "shred"
  - "sdelete"
  - "truncate -s|--size|--size="

# ── The diff budget per reviewed batch ────────────────────────────────────────
# A gate a human cannot actually read is not a gate. These bound what one G3
# batch may contain; over budget, the agent splits the work rather than the
# reviewer skimming it. 0 disables a limit - and says so when it does.
max_files_per_batch: 40
max_lines_per_batch: 1500

# Paths that do not count against the budget, because nobody reads them line by
# line and including them would push real changes over the limit.
budget_exempt:
  - "**/*.lock"
  - "**/package-lock.json"
  - "**/uv.lock"
  - "**/poetry.lock"
  - "**/Cargo.lock"
  - "**/go.sum"

# ── Runner routing floor (item 105) ─────────────────────────────────────────
# The org's pin on WHO may run a phase. Empty = any runner the profile
# declares may be routed; named = a profile may only route within this list,
# the same tighten-only shape as every floor above. An enterprise fills this
# in and every developer's profile picks among them.
allowed_runners: []

# true = a routed runner must hold a green provider-smoke row before a phase
# is entered under it. Default false, deliberately: gates judge whatever a
# runner leaves, so an unproven runner's output cannot pass a gate on its own
# - conformance saves a wasted run, it does not guard correctness.
require_conformance: false

# ── Required phases & gates (org floors — T441c) ─────────────────────────────
# The org's pin on WHICH steps and gates a project may not drop. Empty = a
# profile chooses freely; named = a profile's resolved `phases`/gates must
# INCLUDE each of these, the same tighten-only shape as every floor above.
#
# This is the DURABLE, tamper-resistant control. A project's own `extra_gates`
# (declared in its own profile) are the project's to add or drop; a stop the ORG
# mandates belongs HERE, because a gate named here cannot be dropped by editing
# the profile - `approve` refuses the run, naming this file, the moment it is
# taken (not deferred to merge). Express an org-mandated stop as `required_gates`,
# not as a profile `extra_gates`, which a project can remove from its own profile.
required_phases: []   # e.g. [design, test] - steps every project must run
required_gates: []    # e.g. [G2, G-test]   - gates every project must keep

# ── Where the audit trail's exports go (T454) ────────────────────────────────
# `metrics.py --export ndjson|csv|sqlite` writes FILES; an org's job collects them.
# The destination is, first match wins: `--out` on the command line, then the
# machine's SDLC_METRICS_OUT, then this key, then `.sdlc/metrics/export/`.
# REPO-RELATIVE ONLY: this file is committed, so an absolute path would be wrong
# on the next machine and is refused by name. The harness never holds a database
# connection string - a warehouse is loaded from these files by the org's own job.
metrics_out: ""       # e.g. "reports/sdlc"  (blank = the default)

# How an EXPORT names the people in it (T452). `email` writes each approver's git
# identity as the ledger records it; `hash` writes a stable pseudonym instead
# (`person-<16 hex>`, the same person the same token in every repository's export,
# so an org roll-up still counts per person). The local ledger is never changed.
# This is PSEUDONYMISATION, not anonymity: a hash of a guessable email can be
# recovered by guessing, so treat a hashed export as still personal data.
identity: email       # email | hash
