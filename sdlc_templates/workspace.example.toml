# ─────────────────────────────────────────────────────────────────────────────
# sdlc-workspace.toml — the ONE file that tells the harness about your workspace
# ─────────────────────────────────────────────────────────────────────────────
#
#   cp sdlc_templates/workspace.example.toml sdlc-workspace.toml
#   $EDITOR sdlc-workspace.toml        # set `root`. Nothing else, on the first pass.
#   python sdlc-init.py --workspace sdlc-workspace.toml
#
# Your filled-in copy is YOURS. It is gitignored in this repo, `--workspace` takes
# a path so it can live anywhere on your machine, and no value in it is ever
# written into a shipped harness file. That last part is enforced by a test rather
# than by intention: the leak guard's ban list is GENERATED from this file, so the
# one file that describes your workspace is the one file that tells the guard what
# must never leak out of it.
#
# ── The rule that shapes this file ───────────────────────────────────────────
#
# DECLARE ONLY WHAT DETECTION CANNOT REACH. There is exactly one required field.
# Everything else is auto-detected into .sdlc/profile.yml and is merely
# OVERRIDABLE here.
#
# The reason is not minimalism. Asking you to enumerate components, roles and
# identity collisions BEFORE the first scan asks questions you cannot yet answer,
# and a file filled in blind gets filled in wrong — which is worse than blank,
# because a wrong answer is indistinguishable from a right one until something
# breaks much later.
#
# So: set `root`, run INIT, read what it reports, and come back here only for the
# things it tells you it could not decide.
# ─────────────────────────────────────────────────────────────────────────────

schema_version = 1


# ═════════════════════════════════════════════════════════════════════════════
# REQUIRED — one field (plus the project metadata at the end of this file)
# ═════════════════════════════════════════════════════════════════════════════

# The directory that CONTAINS your repositories (not a repository itself).
# A scanner has to start somewhere, and there is no way to infer where.
#
# May be absolute, or relative to THIS FILE's directory (never to your shell's
# working directory — that would make the same file mean different things
# depending on where you ran it from).
#
# Paths on Windows: TOML treats a backslash inside "double quotes" as an escape,
# so use forward slashes, or wrap the value in 'single quotes' where backslashes
# are literal. Both work; forward slashes work everywhere and are less to get
# wrong. (There is deliberately no Windows path in the examples in this file —
# a shipped harness file may not contain a path that exists on one machine, and
# a test enforces that. The rule is about shipped files, not about your copy.)
root = "/home/you/workspaces/my-workspace"


# ═════════════════════════════════════════════════════════════════════════════
# RECOMMENDED — not required, but INIT will tell you what you lose
# ═════════════════════════════════════════════════════════════════════════════

# Your workspace or organisation name. This SEEDS THE LEAK GUARD: it is hashed
# into the ban list so no shipped file can ever name your organisation.
#
# It is optional because a personal workspace of unrelated side projects has no
# meaningful name, and a required field invites a junk value — which is worse
# than an absent one, since junk gets hashed and then silently protects nothing.
# Leave it blank and INIT says exactly what protection is not active.
#
# It is never emitted anywhere. It goes in, hashed; it does not come out.
name = ""


# ═════════════════════════════════════════════════════════════════════════════
# OPTIONAL — a profile, for file formats your organisation invented
# ═════════════════════════════════════════════════════════════════════════════
#
# Leave this blank until a build tells you something could not be read. Everything a
# generic tool CAN read — build manifests, migrations, deployment packages, web
# frameworks, message brokers — is already covered by extractors that activate on
# your files. What is left is the irreducible remainder: a configuration format
# somebody wrote for themselves, which nothing generic could know about.
#
# A profile is SELECTED here, never activated for every build. That distinction is
# not tidiness: another organisation's file shapes read into your graph would be
# wrong often enough to be believed, because the shapes are plausible and the names
# are yours.
#
#   profile = "orderflow"          a profile shipped with the harness
#   profile = "../my-profile"      a path, relative to THIS FILE
#
# The second form is the one a real workspace uses: your profile is your code, and
# it does not belong in the harness repository. A profile named here that does not
# exist is a hard error — building without it produces a graph short by exactly the
# edges you wrote it for, and nothing in the output would say so.
profile = ""


# ═════════════════════════════════════════════════════════════════════════════
# OPTIONAL — what counts as a component
# ═════════════════════════════════════════════════════════════════════════════
#
# Default: every immediate child directory of `root` that contains a `.git`.
#
# Override when that default is wrong — and it is wrong more often than it
# sounds, because a directory of personal notes has a `.git` too, and a
# monorepo's services live one level deeper than the default looks.
#
# `include` is a whitelist: non-empty means ONLY these. Globs are relative to
# `root`. `exclude` is applied after `include`.

# include = ["services/*", "apps/web"]
# exclude = ["notes", "scratch/*"]

# A SHALLOW CLONE IS DETECTED AND REPORTED, NEVER SILENTLY SKIPPED. It is
# readable but un-diffable, so half the harness works on it and half does not.
# That distinction is a finding you need to see, not a filter that hides it.


# ═════════════════════════════════════════════════════════════════════════════
# OPTIONAL — overrides. Write a block only when detection got something wrong.
# ═════════════════════════════════════════════════════════════════════════════
#
# Detection fills in: name, path, stack, test / coverage / lint / build commands,
# and the vcs block. Anything you set here wins over what it found. Anything you
# leave out keeps what it found — so a block with one key overrides one thing.
#
# A BLANK VALUE MEANS INHERIT, not "set this to empty". The example block below
# ships with blanks, and uncommenting it wholesale must not wipe every detected
# command. To genuinely disable a step, blank it in the generated
# `.sdlc/profile.yml`, where blank means skipped — that file is preserved across
# re-runs precisely so it can hold edits like that.
#
# `name` identifies which component the block applies to and is required inside
# the block. Two blocks with the same name is an error, not a merge: there would
# be no way to tell which one you meant. A block that matches no component is
# also an error — it would otherwise do nothing, silently.
#
# To RENAME a component, set `path` as well: `path` says which directory you
# mean, `name` says what to call it.
#
# A BLOCK WITH AN EXPLICIT `path` ALSO DECLARES A COMPONENT OUTRIGHT, whether or
# not it has a `.git`. The `.git` rule above is a heuristic for deciding what
# counts as a component when you have not said; it must not overrule you when you
# have. This is how you describe a monorepo's service directories, a vendored
# tree, or anything else that is a component without being its own clone.

# [[component]]
# name = "orders"
# path = "services/orders"     # only when the directory name differs from `name`
# role = "authoritative"       # authoritative | legacy | fork | vendor
# test_command = ""            # blank = inherit whatever detection found
# stack = ""                   # blank = inherit
#
# [component.vcs]              # same shape as profile.yml's top-level vcs: block
# deny_raw_git = false

# ── `role` changes behaviour, or it would be decoration ──────────────────────
#
# Detection CANNOT infer this. A fork and its upstream are byte-identical to a
# scanner, and "vendored" is a statement about intent, not about content.
#
#   authoritative  (default)  the real thing. Fully participates.
#   legacy | fork | vendor    INDEXED and visible in blast radius — a fork that
#                             is about to break is exactly what blast radius
#                             exists to find — but never worktree'd, branched or
#                             committed to; excluded from the changed-file
#                             coverage gate and the baseline test run; and never
#                             canonical unless a [[canonical]] block says so.
#
# Indexed but not written to. Those are different questions and `role` is the
# only place you can answer them separately.


# ═════════════════════════════════════════════════════════════════════════════
# OPTIONAL — identity. Fill this in ONLY when INIT reports a collision.
# ═════════════════════════════════════════════════════════════════════════════
#
# When two components declare the same logical service, detection can SEE the
# collision but cannot know which one config and UI links should attach to.
# That is a decision about your intent, so it is yours; guessing it would attach
# real edges to the wrong service and nothing would look wrong.
#
# You will not know this before the first build. INIT names the collisions it
# found; add a block per collision and re-run. Two services of one name, each
# contested inside its own component, are two collisions: a block for each, each
# naming its own `owner` (a node is decided by the first block that designates
# one of its packages; only an exact repeat of a block is refused).

# [[canonical]]
# service = "orders"
# owner   = "orders"           # which component owns the canonical variant
# path    = "charts/orders"    # ONLY when one component holds several variants —
#                              # two deployment trees in one repository, say — where
#                              # `owner` would name that component twice and decide
#                              # nothing. Matched against the declaring file's path
#                              # within the component.
#
#                              # A path covers THE FILE IT NAMES AND EVERYTHING BESIDE
#                              # IT IN THAT DIRECTORY. That matters because a chart
#                              # declares its service in `values.yaml` while publishing
#                              # the host map from `templates/` next door: a claim that
#                              # reached only the file it names would decide the service
#                              # and leave the addresses to whichever tree sorted last.
#                              # So `charts/orders/values.yaml` and `charts/orders` both
#                              # designate that whole tree.
#
#                              # A BARE FILENAME has no directory and covers only itself.
#                              # `docker-compose.yml` designates that file and NOT a
#                              # sibling `legacy/docker-compose.yml` — treating its empty
#                              # parent as a prefix would match every path in the
#                              # component and silently invert the decision recorded here.
#
# There is deliberately no fallback when neither field decides it. The collision is
# reported and nothing is marked, because every available heuristic is a guess in a
# fact's clothing: "prefer the newest file" rewards whoever last touched a dead tree,
# and "prefer the one not called legacy" is a naming convention rather than a
# declaration — and gets it backwards whenever the superseded tree is the one named
# after the service.
#
# A NAME JOIN THAT IS WRONG is the opposite case. A deployment file's service named
# like one of your components — a stock `redis` container beside your own `redis`
# component — is joined to that component by name, and the build says so
# (`name-joined-service`). When the two are NOT the same thing, refuse the join:
# the service then stays on a node of its own, and its configuration with it: the
# values that file sets for the service are no longer read as the same-named
# component's configuration (a service the file builds keeps them - a block refuses
# no build - and so does a component's own namesake service), and a chart it names
# publishes no host address for that component. An edit to a block's `service` or
# `component` marks every published shard stale, as a [[canonical]] edit does; its
# `note` reaches only the rows, so editing that alone stales nothing.

# [[apart]]
# service   = "redis"          # the service name the deployment file declares
# component = "deploy"         # the component whose deployment file declares it
# note      = "a stock redis container, not the redis component"   # OPTIONAL: why
#
# AN IMAGE TWO NAMES SHARE is the third case. A chart, or a compose service that only
# runs an image, deploying the image another component's compose file builds lands on
# a node of its own when its name differs. The graph proposes the join in an
# `image-join-proposed` row and moves nothing until you declare it: name the build node
# it deploys in `onto`, spelled as the row spells it - or decline with `onto = ""` when
# it deploys no build the graph reads (a staging image of the same name, a stock image
# a component happens to build). A declaration the files contradict - the images
# differ - is not followed, and a row says so. Editing a block stales no shard.

# [[deploys]]
# service   = "web"            # the service name the deployment file declares
# component = "charts"         # the component whose deployment file declares it
# onto      = "svc:web@orders" # the build node, as `image-join-proposed` spells it; "" declines
# note      = "the chart runs the image orders builds"   # OPTIONAL: why


# ═════════════════════════════════════════════════════════════════════════════
# OPTIONAL — generated code. Declare trees of committed codegen.
# ═════════════════════════════════════════════════════════════════════════════
#
# Codegen committed into a source tree — a generated API client, protobuf stubs,
# a compose file some tool writes — is where a graph gives its most confidently
# wrong advice: the annotations are perfectly regular, so extraction reads them
# beautifully and then names a file no human should ever edit.
#
# Excluding the tree would be worse. The couplings its facts assert are REAL;
# dropping them removes a live dependency from blast radius. So a declared tree
# is still read, and every fact extracted from under it is stamped `generated`
# (with `regenerate_from`, when you name it) — the fact stays, its meaning
# changes, and impact says "regenerate, don't edit" instead of pointing a human
# at generator output.
#
# Declared, never detected: DO-NOT-EDIT headers are a convention some generators
# skip and some humans paste, and a wrong guess here silently rewrites what a
# fact means.

# [[generated]]
# component = "orders"
# path = "src/gen"             # the tree, relative to the component; covers the
#                              # whole subtree at a segment boundary — `src/gen`
#                              # does not claim `src/gencode.java`
# from = "orders/api/spec.yaml"  # OPTIONAL: the generator's input — where a human
#                              # actually makes the change. Root-relative (it may
#                              # live in another component); file or directory;
#                              # must exist, because "regenerate from X" pointing
#                              # at a missing X is confidently wrong advice.

# ── entry points & domain aliases (OPTIONAL — the semantic layer) ─────────────
# The two fact classes a scanner genuinely cannot reach, declared instead of
# guessed. Every declaration cites this file (name:line) in the graph, so a
# hand-declared fact never blends into extraction — and one that matches nothing
# becomes an unresolved row, never a silent no-op.
#
# ENTRY POINTS: extraction finds every endpoint and cannot tell which is the
# front door. Naming one stamps the node `entrypoint`: rankings and packs carry
# the flag, and traversal treats its fan-out as designed rather than as a hub
# to attenuate. `node` is the graph's own id — find it with the search_nodes
# tool or the validation listings after a first build.

# [[entrypoint]]
# node = "ep:/orders/v1/list"    # a graph node id, TYPE:REST
# note = "the public API's landing call"   # OPTIONAL: why it is a front door

# DOMAIN ALIASES: two components naming ONE business entity with no config seam
# between them — a nightly ETL, a DB view, a convention. There is nothing in
# git to extract, so the join exists only if you declare it. The alias is a
# reachability join between two EXISTING shared entities (topics, tables,
# endpoints); it does not merge identity — that is [[canonical]]'s job — and a
# side owned by a single component is refused, because config seams inside a
# component are the extractors' job.

# [[alias]]
# a = "table:order_events"          # the entity under one component's name
# b = "table:order_reports_cache"   # the same entity under another's
# note = "nightly ETL copies the event table into the reporting cache"


# ═════════════════════════════════════════════════════════════════════════════
# PROJECT METADATA — required before INIT, in ONE of two places
# ═════════════════════════════════════════════════════════════════════════════
#
# INIT stops until it knows what this workspace IS: its name, a one-line
# description, its owner (a team or person) and its criticality (low | medium |
# high). By default that lives in `sdlc-project.toml` at the --target, which
# INIT writes for you to fill the first time it runs. If you would rather keep
# it here, uncomment this table - it then wins over that file. INIT never edits
# this file itself.
#
# [project]
# name = "my-workspace"
# description = "What these repositories do, together"
# owner = "platform-team"
# criticality = "medium"
# compliance = []            # optional, e.g. ["sox", "pci"]
# default_branch = ""        # optional
# issue_tracker = ""         # optional
