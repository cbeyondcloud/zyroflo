# .sdlc/profile.yml — project profile for the SDLC harness
#
# This is the ONE file that makes the generic harness fit THIS workspace.
# It was auto-detected by sdlc-init.py. Edit any value; the harness reads it
# at run time and never hardcodes a command. Re-running the installer will NOT
# clobber your edits (it writes profile.yml.new instead).
#
# Generated: @@GENERATED_AT@@

schema_version: 2                        # bump only on a breaking shape change

# ── Workspace shape ───────────────────────────────────────────────────────────
# One repo and a multi-repo workspace are the SAME lifecycle — they differ only in
# which capabilities are present. `scope: repo` is the degenerate one-component
# case and may omit the `components:` list entirely.
scope: @@SCOPE@@                              # repo | estate

@@COMPONENTS@@

stack: @@STACK@@                         # strongest detected stack (informational)
# Every stack detected here, strongest first. More than one entry is a fact about the
# repository, not a detection failure - and when two claim it equally, the commands below
# are left blank on purpose and `stack_note` says why. Fill them in, or set `stack`.
stacks: @@STACKS@@
stack_note: "@@STACK_NOTE@@"

# ── Lifecycle ─────────────────────────────────────────────────────────────────
# The active phase list IS profile data. The full 12-phase superset, in order:
#   intake, requirements, scoping*, design, implementation, test, review,
#   triage, release, deploy*, verify*, closeout        (* estate / graph tiers)
# The solo default below runs 8 of them. Phases you remove are skipped entirely;
# ordering is fixed by the spec and is not affected by the order you list them in.
phases: [intake, requirements, design, implementation, test, review, triage, closeout]
# `phases[]` SELECTS; it does not sequence - order is the spec's. A name that is
# not a phase is refused rather than dropped, and a phase listed without the
# capability it needs (scoping without a graph) is reported as skipped-for-cause,
# which is a different sentence from skipped-by-choice.

# Which gates halt, and how finely agent changes are reviewed. These are presets,
# not labels: the harness resolves each one to a concrete set of hard gates, and
# stamps the RESOLVED regime into every entry of the run's approval ledger.
#
#   solo      — G2 + G4 halt; the whole branch diff is reviewed at once (G4)
#   team      — all five halt, EVERY agent diff reviewed individually at G3
#   regulated — team, plus block_on includes medium and signing is dsse
#
# THE HALT RULE IS NOT A DIAL. The regime sets how FINELY agent changes are
# reviewed — per diff or per branch — never whether they are. G4 is hard in every
# regime and cannot be overridden; the CI ledger check reads it at merge time.
#
# Run-scope config may only TIGHTEN, against the floors in `.sdlc/policy.yml`.
# `solo` is STRUCTURALLY unselectable once components > 1 — one reviewer cannot
# sign off changes that span repositories, and no policy setting permits it,
# which is what makes it worth more than a floor. The installer emits `team`
# for a multi-component workspace, and hand-editing it back to `solo` is refused
# at run time rather than only at install time.
gate_profile: @@GATE_PROFILE@@                # solo | team | regulated
signing: none                            # none | dsse (cross-person attribution)

# Optional per-gate override. A gate may be made HARDER than the preset makes it,
# never softer — `G3: advisory` under `team` is refused by name, and so is any
# attempt on G4. Uncomment to add a halt the regime does not already require:
# gates:
#   G1: hard                             # hard | advisory

# ── Test & coverage ───────────────────────────────────────────────────────────
test_command: "@@TEST_COMMAND@@"         # full suite; must exit 0 with 0 failures
coverage_command: "@@COVERAGE_COMMAND@@" # produces a coverage report
coverage_threshold: @@COVERAGE_THRESHOLD@@   # minimum % on CHANGED files
coverage_scope: changed                  # changed | whole
known_failures: []                       # tests already red before you started;
                                         #   listed as evidence, never silently ignored

# Supply-chain findings you are ACCEPTING rather than fixing in the change you
# are making now. The same bargain as `known_failures` one gate along: a listed
# finding is reported and not owed, and anything NOT listed still blocks - so a
# CVE published tomorrow against a dependency you declared today is still new.
#
# One entry names ONE vulnerability in ONE package version, four tokens:
#
#   sca_known_findings:
#     - "Maven org.postgresql:postgresql 42.7.11 CVE-2026-54291"
#     - "npm uuid 3.4.0 GHSA-w5hq-g745-h8pq"
#
# The version is part of the identity ON PURPOSE. Bump the package and the
# declaration stops matching, which is exactly the moment somebody should look
# again - a quarantine that survives a version bump is a standing exception over
# a dependency nobody has read since. The advisory may be spelled with any id
# the scanner knows it by, so use the CVE if that is what you have in front of
# you. An entry that matches nothing is REPORTED, so the list cannot quietly rot.
#
# Draft one from a real scan rather than by hand:
#   sca.py --target . --propose-quarantine
# It prints; you paste what you accept. Nothing declares itself.
sca_known_findings: []

# Review findings this repository has DECLARED it does not want reported. The
# third instance of the idiom `known_failures` and `sca_known_findings` use:
# declare it, name it, and ANYTHING NOT DECLARED STILL FIRES.
#
# Written by `learning.py` when a human has rejected the same finding across
# SEPARATE runs - two rejections inside one review are one person deciding one
# thing once. Landing one takes a corpus regression check and a G3, and every
# application and reversal is recorded in `.sdlc/metrics/learning_log.jsonl`,
# which policy.yml protects.
#
# You may write an entry by hand, and it is not refused - but `learning.py
# --audit` will name it as one the audit does not account for, because a
# suppression that passed no gate should not look like one that did.
review_suppress: []

# ── Quality / build / deploy (blank string = step skipped) ─────────────────────
lint_command: "@@LINT_COMMAND@@"
build_command: "@@BUILD_COMMAND@@"
deploy_command: "@@DEPLOY_COMMAND@@"      # blank = no deploy phase; cost-incurring deploys always re-confirmed

# ── Release (blank = step skipped) ────────────────────────────────────────────
release:
  version_command: ""                    # e.g. "npm version {level}" / "mvn versions:set"
  changelog_command: ""                  # e.g. "git cliff -o CHANGELOG.md"
  tag_command: ""                         # blank = plain `git tag -a {version}`
  notes_from_run: true                    # draft release notes from the run's own artifacts

# ── Version control (how the harness commits and publishes) ───────────────────
# Some repos must not be driven with raw git: open-core splits with a second git
# dir, monorepos that route files per destination, signing/policy wrappers. Point
# these at the repo's own script and the harness uses it instead of git.
vcs:
  commit_command: "@@VCS_COMMIT_COMMAND@@"   # blank = plain `git commit -m "<msg>"`. Use {message} for the commit text.
  push_command: "@@VCS_PUSH_COMMAND@@"       # blank = plain `git push`. Use {branch} for the branch name.
                                             #   (blank + deny_raw_git:true = commit_command already publishes, or publishing is off)
  push_remote: ""                            # blank = the policy's own. Must be one `.sdlc/policy.yml`
                                             #   allows: a fork or an internal mirror for an upstream
                                             #   that will not take a direct push.
  branch_pattern: ""                         # blank = <push_branch_prefix><run-id>. MUST contain
                                             #   `<run-id>` and start with the policy's prefix - the
                                             #   push wall and the CI ledger gate both key on this
                                             #   one string, and a pattern only one of them knows
                                             #   is a merge gate that quietly stops applying.
  deny_raw_git: @@VCS_DENY_RAW_GIT@@         # true = the harness must NEVER call `git commit`/`git push`/`git worktree` directly.
                                             #   Also means NO WORKTREE for this component: a worktree
                                             #   carries only the primary .git, so a repo with a second
                                             #   one would silently lose it. It works in place instead,
                                             #   and the run records that it did and why.
  notes: "@@VCS_NOTES@@"                     # why — shown to the agent at Phase 0

# ── State ──────────────────────────────────────────────────────────────────────
plans_dir: ".sdlc/plans"                 # per-run plan + tracker docs (durable state)

# ── Review ─────────────────────────────────────────────────────────────────────
review:
  local_review_command: ""               # tool-native finding generator, e.g. "/code-review" (Claude Code). Blank = review the diff directly
  security_review_command: ""            # e.g. "/security-review" (Claude Code)
  block_on: [critical, high]             # THE exit condition: loop until none of these
                                         #   remain open. Reproducible across providers
                                         #   in a way a score is not.
  review_threshold: 9.5                   # rubric score, REPORTED for continuity — not the gate
  max_iterations: 5                       # hard cap on review iterations
  rubric_overlay: ""                      # optional path to repo-specific rubric additions, e.g. ".sdlc/rubric-overlay.md"
  review_exclude: []                      # globs folded from review (lockfiles, generated code).
                                          #   Every excluded file is NAMED in the pre-pass report -
                                          #   a quiet exclusion is a diff the reviewer thinks is
                                          #   smaller than it is. It narrows the REVIEW and never
                                          #   the secret gate: the whole diff is still scanned for
                                          #   credentials. Excluding every changed file is refused.

# ── Context ────────────────────────────────────────────────────────────────────
tools: [@@TOOLS@@]                        # AI coding tools kept in sync by the installer
conventions_files: [CLAUDE.md, AGENTS.md, README.md]   # repo docs the harness reads in Phase 0
