# The nightly corpus replay (harness item 101).
#
# GENERATED by sdlc-init.py — re-run the installer to refresh it.
#
# WHAT THIS ANSWERS. Item 18 proved once, blind, that the impact engine beat
# grep on three real commits, and item 51 turned that into a replay: rebuild the
# graph at each case's pre-merge parent, rank from the seed, and score against
# the files the merge actually touched. A one-off proof is a claim about a day.
# This is what makes it a claim about the engine.
#
# THE COMPARISON IS PER CASE, and that is the whole design. An aggregate
# precision over a different sample each night moves for reasons that have
# nothing to do with the engine — pick three easy commits and it rises. Every
# case is scored under its own sha and compared only against the last run that
# scored THAT sha.
#
# WHY IT COMMITS. A replay whose result is thrown away has no trend to compare
# against tomorrow, so the row is appended to `.sdlc/metrics/corpus-replay.jsonl`
# and pushed. That is what "publishes precision@k" means here.
#
# WHAT THIS COSTS YOU, SAID PLAINLY. The job needs `contents: write` to append
# that row. `.sdlc/policy.yml` protects `**/metrics/*.jsonl` from the harness's
# own agents precisely because a hand-written row can forge a gate's evidence —
# and a workflow with write access is a second way to write there, available to
# anyone who can edit this file. Put it behind CODEOWNERS if that matters to you:
#
#     # CODEOWNERS
#     /.github/workflows/   @your-team
#
# A SCHEDULE THAT STOPS IS SILENT, which is why it is not the only check.
# `corpus_replay.py --check-fresh` asks whether a replay has run recently, and
# answers `never`, `stale`, `unreadable` or `fresh` — because a nightly job
# nobody is running reports no regressions for exactly the same reason a healthy
# one does. Run it from anywhere; it reads the committed history and needs
# nothing else.
#
# GITHUB DISABLES SCHEDULED WORKFLOWS after 60 days of repository inactivity,
# and does so quietly. That is not a hypothetical for this job — it is the
# failure `--check-fresh` exists to catch, and the reason the freshness check is
# a separate question rather than a step inside this file.
name: SDLC corpus replay

on:
  schedule:
    # 03:17 UTC. Not on the hour: GitHub's scheduler is best-effort and the top
    # of the hour is the most contended minute of the day.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two replays appending to one history is a file with interleaved rows and a
  # push that loses one of them.
  group: sdlc-corpus-replay
  cancel-in-progress: false

jobs:
  replay:
    name: corpus replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # fetch-depth: 0 is load-bearing. A case is replayed at its PRE-MERGE
      # PARENT, and a shallow clone does not contain it — the replay would
      # report fewer cases rather than failing, which is the silent narrowing
      # this whole item is about.
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the harness
        uses: actions/checkout@v4
        with:
          repository: '@@HARNESS_REPO@@'
          path: .sdlc-harness-ci
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5

      - name: Replay the corpus
        env:
          WORKSPACE: '@@WORKSPACE_REL@@'
        run: |
          uv run --project .sdlc-harness-ci \
            python -m tools.corpus_replay \
              --target . \
              --workspace "$WORKSPACE" \
              --replay --write --json

      # Appended, never rewritten, and only when there is something to append.
      # `git diff --quiet` is the test: a run that scored nothing has already
      # failed the step above, so reaching here with no change means the row was
      # identical, which is worth saying rather than committing an empty change.
      - name: Publish the row
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sdlc/metrics/corpus-replay.jsonl
          if git diff --cached --quiet; then
            echo "no new row - nothing to publish"
          else
            git commit -m "chore(sdlc): nightly corpus replay"
            git push
          fi

      # Runs even when the replay failed, because a red replay is exactly when
      # somebody wants to know how long the trend has been trustworthy.
      - name: Report freshness
        if: always()
        run: |
          uv run --project .sdlc-harness-ci \
            python -m tools.corpus_replay --target . --check-fresh || true
