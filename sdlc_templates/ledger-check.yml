# The SDLC approval-ledger gate (harness item 44).
#
# GENERATED by sdlc-init.py — re-run the installer to refresh it.
#
# WHAT THIS DEFENDS. Every gate decision in this repository is a line in
# `.sdlc/runs/<run-id>/approvals.jsonl`, hash-chained so an edited line is
# visible. Hashing alone cannot catch a WHOLESALE rewrite — recompute every
# hash and the file is internally consistent again. Only something that
# remembers the previous file can see that, so this job compares the ledger
# against the pull request's base commit and requires it to have been APPENDED
# to, never rewritten. That is the difference between a tampered ledger being
# detectable and being unmergeable.
#
# IT RUNS ON EVERY PULL REQUEST, ON PURPOSE. The lifecycle pushes `sdlc/*`
# branches, but a tamper check you can dodge by naming your branch something
# else is not a check. The branch name selects only the third question — does
# this run carry an approved merge gate — which needs a run to be about.
#
# TO MAKE IT REQUIRED, which is the whole point: Settings -> Branches -> add
# a branch protection rule for your default branch and tick this job under
# "Require status checks to pass before merging". The harness cannot set that
# for you; a repository's merge rules are the repository owner's to grant.
#
# WHAT THIS CANNOT DEFEND AGAINST, SAID PLAINLY. A `pull_request` workflow runs
# the version of itself that is ON THE BRANCH, so a branch may edit this file
# or `.sdlc/ledger_check.py` in the same change that rewrites a ledger. No CI
# policy check escapes that; the control that does is review, so put both paths
# behind CODEOWNERS and require code-owner review on protected branches:
#
#     # CODEOWNERS
#     /.github/workflows/   @your-team
#     /.sdlc/ledger_check.py @your-team
#
# Weakening the gate then costs a reviewed diff — which is the same guarantee
# the ledger itself rests on, and a far louder one than an edited JSON line.
#
# NO DEPENDENCIES. `.sdlc/ledger_check.py` is one generated, self-contained
# file: standard library only, no harness clone, no network, no packages.
name: SDLC ledger

on:
  pull_request:

permissions:
  contents: read

jobs:
  ledger:
    name: approval ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 is load-bearing. Without the base commit in the clone
      # there is nothing to prove append-only against, and the check reports
      # that as an ERROR rather than a pass — "nothing to compare" must never
      # read as "nothing wrong".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The branch name and base SHA reach the script through the environment,
      # never through `${{ }}` inside the shell line. A branch name is
      # attacker-chosen text; interpolating it into a command is how an
      # untrusted string becomes an executed one.
      - name: Verify the approval ledger
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python .sdlc/ledger_check.py --ledger \
            --target . \
            --base "$BASE_SHA" \
            --branch "$HEAD_REF"
