[project]
name = "sdlc-harness"
version = "0.1.0"
description = "Cross-repo graph substrate + human-gated multi-agent SDLC pipeline"
requires-python = ">=3.11"

# Pinned via uv.lock (canonical). tools/requirements.txt is generated for compat.
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "neo4j>=5.28",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9",
    "tree-sitter-java>=0.23",
    "tree-sitter-python>=0.23",
    # The aggregate language pack publishes no Windows wheels, so every grammar this repo
    # parses is pinned individually. A frontend extractor without one would have to read
    # sources as text, and a path inside a comment would then become a caller nobody can find.
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
# M2+: MCP server layer. M3+: state machine. M5+: metrics/eval.
serve = ["fastmcp>=2.0"]
# `in-toto-attestation` was declared here for DSSE envelope writing and is
# imported by NOTHING - `approve.py` probes `in_toto` alone. It was also the
# only package pulling `protobuf`, which osv-scanner reports against two
# CVEs at `high`, so this repository did not pass its own SCA gate on
# account of a dependency no code uses. The DSSE item re-adds it, and
# `approve.py`'s blocker list says so where that item will be read.
# `pydantic-graph` is gone too, and for the same reason one level further
# on: item 31 declared it for `FileStatePersistence` as the run engine and
# then MEASURED that the pinned 2.x line has no persistence layer at all,
# so `state.py` is the harness's own. The declaration outlived the
# approach it was for, and nothing has re-opened against it.
sdlc = ["in-toto>=3.0"]
eval = ["deepeval>=2.0"]
# pydantic is here and NOT in [project.dependencies]: nothing shipped imports
# it. It is the suite's independent second statement of the policy schema
# (item 35), which is a test need, and a required dependency is something
# every adopter installs.
# `jsonschema` is here for item 107 and for the same reason `pydantic` is:
# the SHIPPED harness must run on a machine with no packages, so nothing in
# tools/ may import it - but a committed JSON Schema nobody validates against
# is a document, not a contract. The suite uses it to require that each schema
# accepts and rejects exactly what the real reader does.
dev = ["pytest>=8.3", "pytest-cov>=6.0", "pydantic>=2.9", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
# "tools", not "tools/graph/tests": the narrower root silently skipped tools/tests/,
# so a bare `pytest` reported green while 46 tests never ran.
testpaths = ["tools"]
addopts = "-q"

[tool.uv]
# Reproducible agent behavior: the lock is the contract.
package = true
