# Harness CI (tracker item 16).
#
# Two jobs, and the first one exists for a reason worth stating: THE SUITE RUNS ON LINUX SO
# THAT THE TESTS WHICH SKIP ON WINDOWS ACTUALLY EXECUTE. Item 74 shipped cross-platform
# binary handling whose three POSIX exec-bit assertions are `skipif(os.name == "nt")`; on the
# only machine that ever ran them they skipped, and the suite printed green for a whole item
# while that code sat unexecuted. Running them once by hand on Linux closed the gap and began
# reopening it immediately — a dated gate record decays the moment anyone edits the file it
# vouches for. This job is what keeps it closed.
#
# `SDLC_FORBID_SKIPS=1` is therefore not decoration: on this runner every precondition the
# suite has is supposed to be satisfiable, so ANY skip fails the job and names itself. See
# tools/conftest.py for why that is opt-in rather than always-on.
#
# THE CONFTEST POLICY-LINT JOB THAT ITEM 16 SPECIFIES WAS RULED OUT AT ITEM 35, and this is
# the record of that decision rather than a deferral. `policy.yml` now exists, so the job
# could have landed - but conftest evaluates Rego, and the same plan paragraph that asked
# for the job also says "policy stays data; no second policy language". Writing the schema
# twice, in Python and in Rego, would make the interesting failure a DISAGREEMENT between
# two checkers rather than a bad policy; and it would add an eighth vendored binary across
# five platforms to re-state what `tools/sdlc/policy.py --validate` already checks.
#
# What replaced it is stronger where it matters and runs everywhere: the validator that
# ENFORCES the policy is the one that validates it (one implementation, no drift), and
# `tools/tests/test_policy.py` holds it honest against an independent pydantic statement of
# the same schema - both required to accept and reject the same documents. The suite below
# runs that, so the lint is in this workflow; it just is not a separate job that would pass
# green whether or not the file it names exists.
#
# THE VENDORED BINARIES ARE FETCHED HERE, AND THE PARAGRAPH THIS REPLACES WAS AN ACCEPTED GAP
# THAT TURNED OUT TO COST MORE THAN IT SAID. It recorded that `third_party/bin/` is gitignored,
# so rg and fd are absent on the runner, `repo_walk` takes its pure-Python fallback throughout,
# and the fd/python parity tests "compare the fallback with itself and pass tautologically
# here". All of that was true. What it did not say is how much passes that way. MEASURED with a
# spawn tracer over the nine test files that reach a vendored tool: binaries present, 320 passed
# and 59 tests spawned a tool; binaries absent, 320 passed and ZERO spawned, exit 0 both, the
# absent run 9.8s faster. Eleven test items are vacuous rather than merely narrower, and two of
# them guard the two incidents CLAUDE.md holds up under "the rule that has caught the most bugs
# here" — `fd --glob a --glob b` reading `b` as a search path and reporting a workspace as
# having no workflows, and `fd --full-path` matching a backslash on Windows so every
# repo-relative glob matched nothing at exit 0. Both were found by hand; both are now defended
# only by assertions that cannot run on the gate of record.
#
# The old paragraph's two reasons are answered rather than ignored. "A network download on the
# critical path": five tools, not six — `gh` is the one left out, and NOT because nothing
# spawns it: tests DO spawn it wherever it is installed. It is left out because every reply
# path release.py has authenticates, so a fetched gh could only re-read a local help page —
# five requests against a job whose budget is twenty minutes. The download SIZE is deliberately not written here: a byte count in prose that
# nothing re-derives is the thing that went stale three times in two days, and the list of
# tools is welded to `SPAWNED_BY_TESTS` by a test while a number never could be. "A gate that reddens for connectivity is one people learn to ignore": true,
# and the fix is that an unreachable upstream says so in those words and exits 3, distinct from
# the exit 1 that means the bytes were wrong, so the two are never confused for each other.
#
# IT FAILS THE JOB RATHER THAN DEGRADING. There is deliberately no `continue-on-error` here. A
# fetch whose failure is tolerated leaves the suite running against no binaries and reporting
# 320 passed, which is byte-for-byte the condition this step was added to end — a red that is
# explained is better than a green that is wrong. `SDLC_REQUIRE_VENDORED_BINARIES` is the
# second half of that: the suite itself refuses to pretend, so even a future
# `continue-on-error` cannot restore the silent fallback.
#
# Stubs were costed and rejected FOR THIS, not in general: ten of the eleven vacuous items are
# parity assertions, and you cannot prove two implementations agree by replacing one of them
# with a stub. A stub reproducing fd's `--full-path` behaviour would be a second copy of the
# bug. The one item whose contract is a process contract — an exit code and a stream shape —
# is stubbed separately and keeps its stub.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first; nothing here is worth paying twice for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: suite (linux)
    runs-on: ubuntu-latest
    # The runner's default is six hours. A hung test or a Neo4j that never becomes reachable
    # would spend all of it before anyone found out, and these minutes are metered.
    timeout-minutes: 20

    env:
      # The floor declared in pyproject.toml, not the version the author happens to run.
      # Testing only the newer one leaves `requires-python = ">=3.11"` an assertion.
      PYTHON_VERSION: "3.11"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      SDLC_FORBID_SKIPS: "1"
      # The suite's own refusal to run the fallback while believing it ran the tool. Read by
      # tools/tests/test_third_party.py: with this set, a vendored tool the tests spawn that
      # does not resolve is a FAILURE, not a silent fallback. It exists because the fetch step
      # below could be made non-fatal by one line, and then nothing downstream would notice.
      SDLC_REQUIRE_VENDORED_BINARIES: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, AND THIS JOB NEEDS IT MORE THAN THE SECRET SCAN DOES. Four tests
          # here derive their claim from history, and on the default depth-1 checkout two of
          # them fail and two print green having checked nothing:
          #   test_the_core_was_not_touched  diffs against a baseline SHA recorded in
          #     core_baseline.md — the object is absent, so git exits 128 on `bad object`
          #   test_there_is_history_to_check  sees one commit
          #   test_no_banned_coordinate_survives_anywhere_in_history  scans every blob in
          #     every commit; with one commit that IS the working tree, which
          #     test_no_private_coordinates.py already covers — so the whole point of the
          #     history guard quietly evaporates
          #   test_the_answer_key_landed_before_any_extractor  a depth-1 commit adds every
          #     file at once, so the answer key and the extractors carry the SAME timestamp
          #     and the pre-registration is "proven" by comparing a commit with itself
          # The second pair is the worse half — a guard that checks nothing still reports
          # success — and this file is what caused it. Those two now fail loudly as well
          # (tools/tests/_repo.py), but the fix for the cause belongs here.
          fetch-depth: 0

      # NEO4J IS A STEP, NOT A `services:` CONTAINER, AND NOT BACKED BY A REPO SECRET.
      # Both halves of that were decided together, and each fixes a real defect in the
      # first version of this file:
      #
      # (a) A stored secret would be withheld from any `pull_request` run originating in a
      #     fork — GitHub does that deliberately — so the moment this repo goes public, every
      #     external contributor's PR would fail on a credential it can never be given. A
      #     password minted here, used only by a container on this runner, and discarded with
      #     the runner is strictly less exposure than a stored one, and it needs nothing
      #     configured in repo settings for a fresh clone or a fork to build.
      #
      # (b) Service containers are created BEFORE the job's first step, so a missing or
      #     malformed password killed Neo4j during job initialisation and the guard step
      #     written to explain that never got the chance to run. The failure surfaced as an
      #     opaque container error — which is the "a red build that is a puzzle gets
      #     bypassed" failure this file is otherwise careful about.
      #
      # Started before `uv sync` on purpose: Neo4j takes tens of seconds to accept bolt, and
      # that overlaps with the install rather than being paid for afterwards.
      - name: Start Neo4j
        run: |
          # hex, so the value cannot contain the `/` that NEO4J_AUTH uses as its own
          # separator — the format is `neo4j/<password>` and a slash inside would split it.
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::${PW}"
          echo "NEO4J_PASSWORD=${PW}" >> "${GITHUB_ENV}"
          # No --rm: if the container dies, the wait step below needs its logs to say why.
          docker run -d --name neo4j-ci -p 7687:7687 \
            -e NEO4J_AUTH="neo4j/${PW}" \
            neo4j:5-community

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the locked environment
        # --locked, never a fresh resolve: uv.lock is the contract, and a CI run that
        # silently resolved something else would be testing an environment nobody has.
        #
        # --extra dev is load-bearing. pytest lives under [project.optional-dependencies],
        # which are EXTRAS, and `uv sync` installs extras only when asked — unlike
        # [dependency-groups], whose dev group it would install by default. The developer's
        # .venv already has pytest from an earlier sync, so the omission is invisible
        # locally and fatal on a clean runner.
        #
        # --extra serve for the same reason since item 23: the MCP server suite imports
        # fastmcp directly (this suite forbids skips, so absence is a failure, not a
        # skip), while the shipped module degrades loudly without it — which the parity
        # gate asserts separately, in an environment that HAS no extras.
        #
        # --extra sdlc for the same reason since item 108: `approve.py` writes DSSE
        # envelopes through securesystemslib (pulled by in-toto), and the signing suite
        # exercises real sign/verify rather than a fake. Absence is a failure here, not
        # a skip — and it WAS a failure: item 108 went green locally, where the extra
        # was already installed, and red on CI at 13 tests. A feature behind an optional
        # extra is not finished until this line names it.
        run: uv sync --locked --python "${PYTHON_VERSION}" --extra dev --extra serve --extra sdlc

      - name: Wait for Neo4j
        # Without a reachable store the 13 GraphStore contract tests skip — and they cover
        # the only store implementation there is. Skipping them would leave CI reporting
        # green over the whole persistence layer, which is precisely what SDLC_FORBID_SKIPS
        # refuses to allow. Failing HERE names the cause; letting the suite run would have
        # blamed the skip gate instead.
        #
        # THIS POLLS WITH THE REAL DRIVER, AND THE FIRST VERSION'S TCP CHECK WAS WRONG.
        # Measured on this image: the bolt port accepts a TCP connection ~2s after the
        # container starts and does not complete a handshake until ~9s. A `/dev/tcp` probe
        # therefore reports "ready" during a seven-second window when the database is not
        # serving — an open port reading exactly like a live service, which is this
        # project's recurring failure shape in a new place. Connecting the way the tests
        # connect, with the same URI and the same credentials, is the only check whose
        # success means what the next step needs it to mean. It runs after `uv sync`
        # because it needs the driver the lockfile pins.
        run: |
          cat > /tmp/wait_neo4j.py <<'PY'
          import os, sys, time
          from neo4j import GraphDatabase
          last = None
          for _ in range(60):
              try:
                  driver = GraphDatabase.driver(
                      os.environ["NEO4J_URI"],
                      auth=(os.environ["NEO4J_USER"], os.environ["NEO4J_PASSWORD"]))
                  driver.verify_connectivity()
                  driver.close()
                  print("neo4j authenticated and serving")
                  sys.exit(0)
              except Exception as exc:
                  last = exc
                  time.sleep(2)
          print(f"::error::Neo4j never authenticated ({type(last).__name__}: {last}). The 13 "
                "GraphStore tests would have skipped, and the skip gate would have been "
                "blamed for what is really a database that never came up.")
          sys.exit(1)
          PY
          if ! uv run --locked --python "${PYTHON_VERSION}" --extra dev --extra serve python /tmp/wait_neo4j.py; then
            echo "--- docker logs neo4j-ci ---"
            docker logs neo4j-ci || echo "(container is gone; it failed to start at all)"
            exit 1
          fi

      - name: Fetch the vendored binaries the suite spawns
        # FIVE TOOLS, AND THE LIST IS MEASURED RATHER THAN COPIED FROM THE MANIFEST. A spawn
        # tracer recorded, per test, every subprocess whose argv[0] is a vendored tool: fd, rg,
        # gitleaks, sg and osv-scanner — and `sg` is the binary
        # `ast-grep` ships, which is why the name below is the MANIFEST KEY and not the name
        # the tracer saw. The per-tool count of tests that spawn each is deliberately NOT written
        # here: nothing re-derives it, so it goes stale the moment a spawning test is added or
        # removed. The list is welded instead -- tools/third_party.py's SPAWNED_BY_TESTS is the
        # one spelling, and test_third_party.py holds this --only list equal to it. `gh` is the
        # one pinned tool this step leaves out, and the reason is
        # NOT that nothing spawns it: with the binary installed, tests in
        # test_vendored_tool_coverage.py spawn it. It is left out because every reply path
        # release.py has is an
        # authenticated request, so those spawns can only re-read a LOCAL help page  `osv-scanner` was in that sentence
        # until the tool-coverage row and is not any more — forced offline it drives the
        # shipped regex that decides `nothing-scanned` against `ok`, and that regex had only
        # ever been fed strings this repository wrote itself. That is also why this names tools
        # instead of fetching the manifest:
        # `--fetch` alone installs all six.
        #
        # --only REFUSES an unknown name instead of skipping it, which is the whole reason it
        # is not a grep over a list: a typo here that quietly selected nothing would install no
        # binaries, exit 0, and hand the suite exactly the state this step removes.
        #
        # The digests are the pins in third_party/manifest.json, checked before anything is
        # extracted and again after; the manifest is NOT rewritten when the digest matches what
        # was pinned, so this step leaves the tree clean (third_party.py's cmd_fetch, and the
        # fix that stopped a no-op fetch from rewriting the file under it).
        run: |
          uv run --locked --python "${PYTHON_VERSION}" --extra dev --extra serve \
            python tools/third_party.py --fetch --only fd rg gitleaks ast-grep osv-scanner
          # The tree must be unchanged by a fetch that learned nothing. A dirtied manifest here
          # is a real defect wearing the costume of an unrelated red, so it is named at the
          # point it would happen rather than puzzled over later.
          if ! git diff --exit-code -- third_party/manifest.json; then
            echo "::error::--fetch rewrote third_party/manifest.json. Either a pinned digest is"
            echo "::error::genuinely stale (then re-pin in a reviewed PR) or save() changed its"
            echo "::error::rendering. Either way the diff above is the evidence, not noise."
            exit 1
          fi

      - name: Suite
        # --python again, explicitly: `uv run` picking a different interpreter than `uv sync`
        # built for would silently create a second environment, and the run would then be
        # green against something nobody installed.
        # Every `uv run` names the same extras as the sync above: a run asking for a
        # different extra set re-syncs the environment mid-job to something else.
        run: uv run --locked --python "${PYTHON_VERSION}" --extra dev --extra serve pytest

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. Item 73 rewrote published history to remove a committed workspace
          # inventory, and the repo's own test_history_is_clean.py already re-checks every
          # blob for workspace COORDINATES. gitleaks answers the different question — keys,
          # tokens, credentials — and answering it over one commit would miss the case that
          # actually bites, since anything in history outlives the commit that added it.
          fetch-depth: 0

      - name: gitleaks
        # The binary, not the action wrapper: the wrapper carries licence logic that varies
        # by account type, and a gate that can fail for billing reasons is a gate people
        # learn to ignore. Pinned by tag on purpose — re-pins go through review, same rule
        # as every other vendored tool.
        run: |
          docker run --rm -v "${PWD}:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose
