# The fixture's own workspace config — the same shape a developer fills in.
#
# It is committed because the fixture must build the same way a real workspace does: if the
# golden test reached the components by any other route, it would be testing a path no
# adopter ever takes.
#
# `root = "."` because this file sits inside the workspace it describes. `read_workspace()`
# resolves a relative root against THIS FILE, never the shell's cwd, so the fixture builds
# identically from the repo root, from a subdirectory, or from CI.

schema_version = 1

root = "."

# Deliberately blank. The fixture has nothing to protect and a name here would seed the
# leak guard with an invented term, which weakens the list for no benefit.
name = ""

# The write-mapping format is this workspace's own invention, so nothing generic can read it.
# A profile is SELECTED here rather than activated for every build: another organisation's
# file shapes read into your graph would be wrong often enough to be believed.
profile = "orderflow"

# ── the components are DECLARED, not discovered ──────────────────────────────
# Discovery finds directories containing a `.git`, and these are directories inside the
# harness repo rather than separate clones — git refuses to track a nested `.git`, and it
# refuses SILENTLY, with no error and no staged entry.
#
# A [[component]] block with an explicit `path` therefore declares a component outright.
# The `.git` rule is a heuristic for deciding what counts as a component when nobody said;
# it must not overrule somebody who did. The same path serves a monorepo's service
# directories and any workspace whose components are not separate checkouts.

[[component]]
name = "orders-api"
path = "orders-api"

[[component]]
name = "orders-worker"
path = "orders-worker"

[[component]]
name = "orders-shared"
path = "orders-shared"

[[component]]
name = "web-console"
path = "web-console"

[[component]]
name = "orders-notifier"
path = "orders-notifier"

[[component]]
name = "deploy-charts"
path = "deploy-charts"

[[component]]
name = "legacy-reports"
path = "legacy-reports"

# ── D4: the canonical collision ──────────────────────────────────────────────
# Two chart trees declare service `orders-api`. Detection can SEE that; it cannot know
# which variant config and UI links should attach to. This is that decision, and it is
# here rather than inferred because inferring it would attach real edges to the wrong
# service while looking entirely correct.
#
# `path` is what decides it, because both trees live in ONE component and `owner` alone
# would name that component twice. Note that no heuristic reaches this answer: the CURRENT
# tree sits under a generic directory and the SUPERSEDED one under the service's own name,
# so "prefer the tree named after the service" gets it exactly backwards.
[[canonical]]
service = "orders-api"
owner = "deploy-charts"
path = "charts/orderflow"

# ── item 78: the generated tree ──────────────────────────────────────────────
# `orders-api/gen/` is committed codegen. Extraction must READ it — the coupling its
# facts assert is real — but every fact from under it changes meaning: stamped
# `generated`, carrying where a human actually makes the change. Declared, never
# detected: the DO-NOT-EDIT header inside the tree is realistic and deliberately
# ignored, because a marker is a convention and this is a statement of intent.
[[generated]]
component = "orders-api"
path = "gen"
from = "orders-api/src/main/resources/openapi.yaml"

# ── roles ────────────────────────────────────────────────────────────────────
# Everything is authoritative. `legacy-reports` is NOT marked legacy on purpose: the
# negative control has to prove that an inert component stays inert under ordinary
# treatment, not that a role flag can suppress it.

# ── item 79: the semantic layer — what a scanner genuinely cannot reach ──────
# Entry points: extraction finds every endpoint and cannot tell which is the front
# door. Declared here, the node is stamped `entrypoint` — rankings carry the flag,
# and traversal treats its fan-out as designed rather than as a hub to attenuate.
[[entrypoint]]
node = "ep:/orders/v1/list"
note = "the console's landing call - the API's front door"

[[entrypoint]]
node = "ui:web-console@web-console"
note = "the user-facing surface"

# Domain aliases: two components naming ONE business entity with no config seam
# between them — invisible to extraction by construction, because there is nothing
# to extract. The reporting cache below is filled from the chain's event table by
# an ETL job that lives outside this repository; this block is that job's only
# in-repo trace. The negative control (P5) stays honest: no legacy FILE references
# the chain — the bridge exists only as this declaration, which is the point.
[[alias]]
a = "table:order_events"
b = "table:order_reports_cache"
note = "one entity - the chain writes it, the ETL copies it nightly for reports"
