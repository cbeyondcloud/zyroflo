# Context path is prepended to every controller mapping. Hop 2 of the chain needs it.
server.servlet.context-path=/orders

# D3: a ${} placeholder WITH a default. The default is what resolves.
orders.publish.topic=${ORDER_TOPIC:order-events-v1}

# D2: the same topic key spelled three ways. relaxed_key must collapse all three onto
# one key, or the graph grows two phantom topics beside the real one.
ORDERS_PUBLISH_TOPIC=order-events-v1
orders-publish-topic=order-events-v1

# D8: a placeholder with NO default. Nothing can resolve this at build time; it must be
# reported as unresolved rather than taken literally as the string "${AUDIT_TOPIC}".
orders.audit.topic=${AUDIT_TOPIC}

inventory.service.host=http://inventory-api:8080
inventory.service.reserve.path=/inventory/v1/reserve

# Item 91: keys that reach the producer only through a config class's getters.
orders.notify.topic=order-notify-v1
orders.stream.topic=order-stream-v1
