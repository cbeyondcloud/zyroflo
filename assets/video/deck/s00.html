<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s00 — title card</title>
<link rel="stylesheet" href="theme.css">
<style>
  .eyebrow { position:absolute; left:0; right:0; top:300px; text-align:center;
             font-size:24px; font-weight:700; letter-spacing:.34em; text-transform:uppercase;
             color:var(--muted); }
  .mark    { position:absolute; left:0; right:0; top:352px; text-align:center;
             font-size:158px; font-weight:800; letter-spacing:-.03em; }
  .tag     { position:absolute; left:0; right:0; top:566px; text-align:center;
             font-size:46px; font-weight:700; letter-spacing:-.01em; color:var(--text); }
  .rule    { position:absolute; left:910px; top:520px; width:100px; height:3px;
             background:var(--neon); box-shadow:0 0 16px rgba(255,61,154,.6); border-radius:2px; }
</style>
</head>
<body>
<div class="stage">
  <div class="eyebrow" id="ey">Cbeyond Technologies</div>
  <div class="mark" id="mark"><span class="wordmark">Zyroflo</span></div>
  <div class="rule" id="rule"></div>
  <div class="tag" id="tag">Conquer the next frontier with <span class="grad">AI-driven SDLC.</span></div>
</div>

<script>
window.build = T => {
  T.dur = 2.8;

  T.at('#mark', 0.15, 1.0, [{opacity:0, transform:'scale(1.12)', filter:'blur(14px)'},
                            {opacity:1, transform:'none', filter:'blur(0)'}]);
  T.fadeIn('#ey', 0.7, 0.7);
  T.at('#rule', 0.9, 0.7, [{opacity:0, transform:'scaleX(0)'},
                           {opacity:1, transform:'scaleX(1)'}]);
  T.fadeUp('#tag', 1.15, 0.8);
};
</script>
<script src="scene.js"></script>
</body>
</html>
