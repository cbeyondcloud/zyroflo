<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140" role="img" aria-label="Zyroflo — AI-driven SDLC, human-governed">
  <defs>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#db2777"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- mark: circled Z flanked by inward chevrons -->
  <g transform="translate(4,24)">
    <polyline points="12,26 30,48 12,70" fill="none" stroke="url(#zg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="116,26 98,48 116,70" fill="none" stroke="url(#zg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="64" cy="48" r="30" fill="none" stroke="url(#zg)" stroke-width="7"/>
    <text x="64" y="62" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ff3d9a">Z</text>
  </g>

  <!-- wordmark + centered tagline -->
  <text x="312" y="78" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-1" fill="url(#zg)">Zyroflo</text>
  <rect x="176" y="90" width="272" height="4" rx="2" fill="#ff3d9a"/>
  <text x="312" y="116" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#9aa6c2">AI-DRIVEN SDLC &#183; HUMAN-GOVERNED</text>
</svg>
